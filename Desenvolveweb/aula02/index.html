    <!-- <tagname style="property:value;">-->
    <h1 style="background-color: rgb(3, 18, 83);color:rgb(251, 251, 251)">Técnico em Informática</h1>

    <!--
    style - atributo para estilizar elementos HTML
    background-color - para cor de fundo
    color - para cor de texto
    font-family - para fonte de texto
    font-size - tamanhos de texto
    text-align - alinhamento de texto
    -->
    <!--
    <br> - pula linha
    <b> - negrito
    <strong> - texto importante
    <i>- texto itálico
    <em> - texto enfatizado
    <mark> - texto marcado
    <small> - texto menor
    <sub> - texto subscrito
    <sup> - texto sobrescrito
    -->

    <p><b>texto</b></p>
    <p><strong>texto</strong></p>
    <p><i>texto</i></p>
    <p><em>texto</em></p>
    <p><mark>texto</mark></p>
    <p><mark style="background-color: aquamarine;">texto</mark></p>
    <p><small>texto</small></p>
    <p>text<sub>o</sub></p>
    <p>text<sup>o</sup></p>
    
    <!-- Trabalhando com cores-->
    <!-- -->

    <p style="color:#0000FF">Cor</p>
